name: Refresh catalogue and deploy

on:
  schedule:
    # Hourly. Fast enough to track an activation without generating dozens of
    # commits a day. Run the workflow manually if something has just been
    # released and you do not want to wait.
    - cron: '7 * * * *'
  push:
    branches: [main]
  workflow_dispatch:
  # GitHub's scheduler is unreliable for this repo: one `schedule` event in
  # roughly 24 hourly slots, and that one 25 minutes late. The dependable
  # schedule is a Cloudflare Worker cron that fires this dispatch; see worker/.
  # To dispatch by hand:
  #   gh api repos/OWNER/REPO/dispatches -f event_type=refresh
  repository_dispatch:
    types: [refresh]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild event catalogues
        id: build
        # Exit 2 means an upstream API was unavailable and the previous
        # catalogue was deliberately kept. That is not a failure worth
        # alerting on, but it should not be silent either.
        run: |
          set +e
          python3 scripts/build_catalog.py
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "::warning::One or more catalogues kept stale (upstream unavailable)"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi

      - name: Commit if the catalogue actually changed
        # Every build stamps a fresh `generated` time, so a plain "did anything
        # change" test is always true and would produce a commit an hour,
        # forever, burying real catalogue changes in timestamp noise. Commit
        # only when something other than that timestamp moved.
        #
        # The deploy below is unconditional and builds from the working tree,
        # not from HEAD, so the live site still shows the true last-checked
        # time even on the runs that do not commit.
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          paths="data/ index.html ./*/index.html"

          if git diff --quiet -- $paths; then
            echo "No change."
            exit 0
          fi

          substantive=$(git diff -U0 -- $paths \
            | grep -E '^[+-]' \
            | grep -vE '^(\+\+\+|---)' \
            | grep -vcE '"generated":|Catalogues refreshed' || true)

          if [ "${substantive:-0}" -gt 0 ]; then
            echo "$substantive substantive line(s) changed; committing."
            git add $paths
            git commit -m "chore: refresh catalogue $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          else
            echo "Only the refresh timestamp changed; deploying without a commit."
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
